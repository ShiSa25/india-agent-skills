name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SPEC §0.6 names Node 20 and 22. This workflow also runs 24,
        # which the phase-0 request asked for. Helpers do not depend on ICU.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      # SPEC §0.6 step 2 asks for `npx skills-ref validate`, pinned to a commit.
      # The spec names neither the package nor the commit, and validation must
      # pass with no network, so `npm run validate` uses tools/validate-frontmatter.mjs.
      - name: Test
        run: npm test
      - name: Validate
        run: npm run validate
